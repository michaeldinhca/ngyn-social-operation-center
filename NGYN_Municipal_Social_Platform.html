const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const state=JSON.parse(localStorage.getItem('ngyn-demo')||'null')||{page:'overview',role:'Administrator',dept:'All departments',account:'All accounts',paused:false,composerStep:1,posts:[{id:1,title:'Fall leaf collection begins Monday',status:'In review',owner:'Maya Chen',net:'FB + IG'},{id:2,title:'Route 8 detour notice',status:'Scheduled',owner:'Noah Grant',net:'FB + BS'},{id:3,title:'Community pool hours',status:'Draft',owner:'Emma Roy',net:'IG'}],notes:[],resolved:[]};

const nav=[['overview','⌂','Overview'],['inbox','◎','Resident Inbox'],['calendar','▦','Publishing Calendar'],['content','✎','Content & Approvals'],['listening','◉','Social Listening'],['analytics','⌁','Analytics & Reports'],['media','▣','Media Library'],['ads','◇','Paid Advertising'],['emergency','⚠','Emergency Controls'],['admin','⚙','Administration']];

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function badge(s){let c=s.match(/healthy|published|approved|active|available/i)?'ok':s.match(/failed|blocked|unsupported|expired/i)?'fail':'warn';return `<span class="badge ${c}">${s}</span>`}
function shell(){state.page='overview';return `<div class="shell"><aside class="sidebar" id="side"><div class="brand"><div class="mark">N</div><div><h1>NGYN Civic Social</h1><small>Harbourview Demo</small></div></div><nav class="nav" aria-label="Primary">${nav.map((n,i)=>`<button ${i?'disabled title="Planned for the next design review"':'data-page="overview"'} class="${i?'':'active'}"><span class="ico">${n[1]}</span>${n[2]}${i?'<span style="margin-left:auto;font-size:9px;opacity:.55">SOON</span>':''}</button>`).join('')}</nav><div class="demo-card"><strong>● FICTIONAL DEMO MODE</strong><p>No vendor API calls, real residents, external sends, or advertising spend.</p></div></aside><section class="content"><header class="topbar"><button class="btn mobile-menu" id="menu" aria-label="Open menu">☰</button><div class="crumb"><small>Municipality of Harbourview · Fictional</small><strong>Overview · Direction preview</strong></div><div class="toolbar"><select class="control" id="account" aria-label="Account filter">${accounts.map(x=>`<option ${x===state.account?'selected':''}>${x}</option>`)}</select><select class="control" id="dept" aria-label="Department filter">${departments.map(x=>`<option ${x===state.dept?'selected':''}>${x}</option>`)}</select><button class="btn" title="Notifications">🔔 <span class="sr">Notifications</span></button><select class="control" id="role" aria-label="Demo role">${Object.keys(rolePages).map(x=>`<option ${x===state.role?'selected':''}>${x}</option>`)}</select><div class="avatar" title="Avery Morgan">AM</div></div></header><main id="main" class="main">${overview()}</main></section></div><div id="modal"></div>`}
const head=(title,sub,action='')=>`<div class="page-head"><div><span class="simulation">◆ SIMULATED DATA</span><h2>${title}</h2><p>${sub}</p></div>${action}</div>`;
function overview(){return head('Good morning, Avery','Here’s what needs attention across municipal channels.',`<button class="btn primary" data-action="compose">＋ Create post</button>`)+`<div class="grid metrics"><div class="metric"><span class="label">Open resident cases</span><b>24</b><span class="delta">↓ 12% from last week</span></div><div class="metric"><span class="label">Awaiting approval</span><b>7</b><span class="delta">2 due today</span></div><div class="metric"><span class="label">Scheduled posts</span><b>${state.paused?'0':'18'}</b><span class="delta">${state.paused?'Emergency pause active':'Next in 48 minutes'}</span></div><div class="metric"><span class="label">Median response time</span><b>42m</b><span class="delta">Within 2h target</span></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Operations queue</h3>${[['Route 8 detour reply','Resident Inbox','High'],['Fall leaf collection','Approval','Due 11:30'],['Pool closure photo','Missing ALT text','Accessibility'],['Transit mentions spike','Listening','Verify']].map((x,i)=>`<div class="queue-item"><span class="dot ${i===0?'red':i>1?'amber':''}"></span><div class="grow"><strong>${x[0]}</strong><small>${x[1]}</small></div>${badge(x[2])}</div>`).join('')}</div><div class="card"><h3>Channel health · 18 accounts</h3>${[['Facebook','8 connected','healthy'],['Instagram','2 connected','healthy'],['Bluesky','6 connected','degraded'],['LinkedIn','1 connected','review'],['YouTube','1 connected','healthy']].map(x=>`<div class="row"><span class="network">${x[0][0]}</span><div class="grow"><strong>${x[0]}</strong><small>${x[1]}</small></div>${badge(x[2])}</div>`).join('')}<button class="btn soft" data-page="admin" style="margin-top:12px">View limitations</button></div></div>`}
const inboxItems=[['CASE-1048','Pothole on Alder Street','Facebook','Negative','Public Works'],['CASE-1047','When does Route 8 resume?','Instagram','Urgent','Transit'],['CASE-1046','Thanks for the new playground!','Bluesky','Positive','Recreation'],['CASE-1045','Missed green bin pickup','Facebook','Negative','Customer Service'],['CASE-1044','Permit counter opening hours','Facebook','Neutral','Unassigned']];
function inbox(){return head('Resident Inbox','Classify, assign, collaborate and respond with human oversight.',`<button class="btn" data-action="suggest">✦ Mock AI triage</button>`)+`<div class="callout"><strong>Provider boundary:</strong> Reply buttons are simulation-only. Availability depends on account permissions and platform review.</div><div class="filters"><select class="control"><option>All networks</option><option>Facebook</option><option>Instagram</option><option>Bluesky</option></select><select class="control"><option>All sentiment</option><option>Negative</option><option>Urgent</option></select><select class="control"><option>All categories</option><option>Roads</option><option>Transit</option><option>Waste</option></select><input class="control" placeholder="Search cases…"></div><div class="card table-wrap"><table class="table"><thead><tr><th>Case</th><th>Resident message</th><th>Network</th><th>Signal</th><th>Assigned</th><th>Status</th></tr></thead><tbody>${inboxItems.map((x,i)=>`<tr data-case="${i}" tabindex="0"><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]}</td><td>${badge(x[3])}</td><td>${x[4]}</td><td>${state.resolved.includes(i)?badge('Resolved'):badge(i<2?'SLA risk':'Open')}</td></tr>`).join('')}</tbody></table></div>`}

  <script data-source="users.js">
const functionList=[['content.create','Create content','Write and edit drafts.','Content'],['content.approve','Approve content','Review content submitted by others.','Content'],['content.publish','Schedule & publish','Schedule or publish approved content.','Content'],['inbox.respond','Respond to residents','View conversations and prepare replies.','Engagement'],['reports.view','View reports','View analytics and export reports.','Reporting'],['ads.create','Create ads','Build advertising drafts.','Advertising'],['ads.manage','Manage ads','Edit and manage existing campaigns.','Advertising'],['ads.accounts.add','Add ad accounts','Register ad accounts for administrator review.','Advertising']];
const permissionKey='ngyn-user-access-v2';
let accessUsers;try{accessUsers=JSON.parse(localStorage.getItem(permissionKey))||groupData.users.map((u,i)=>({...u,id:'user-'+i,status:'Active',functions:i===0?functionList.map(f=>f[0]):['content.create'],channels:i===0?groupData.channels.slice(0,3).map((_,j)=>'social-'+j):[],adAccounts:[]}))}catch{accessUsers=[]}
const socialResources=groupData.channels.map((c,i)=>({id:'social-'+i,name:c.name,detail:c.network}));
const adResources=[{id:'ads-communications',name:'Harbourview Communications',detail:'Meta ad account · Fictional'},{id:'ads-recreation',name:'Harbourview Recreation',detail:'Meta ad account · Fictional'}];
let userFilter='';
function saveAccessUsers(){localStorage.setItem(permissionKey,JSON.stringify(accessUsers))}
function installUsers(){if(document.querySelector('#users-nav'))return;const b=document.createElement('button');b.id='users-nav';b.innerHTML='<span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M4 22v-3a8 8 0 0 1 16 0v3"/></svg></span>Users';document.querySelector('.nav').insertBefore(b,document.querySelector('#groups-nav'));b.onclick=showUsers}
function showUsers(){installUsers();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelector('#users-nav').classList.add('active');document.querySelector('.crumb strong').textContent='User management';document.querySelector('#main').innerHTML=`<div class="page-head groups-heading"><div><div class="eyebrow">ADMINISTRATION / PEOPLE</div><h2>Users</h2><p>Add your team. Choose what they can do and where they can do it.</p></div><button class="btn primary" id="new-user">＋ Add user</button></div><div class="access-explainer"><div><strong>1. Add a person</strong><span>Name and login email</span></div><span class="flow-arrow">→</span><div><strong>2. Enable functions</strong><span>Choose what they can do</span></div><span class="flow-arrow">→</span><div><strong>3. Assign accounts</strong><span>Choose where permissions apply</span></div><div class="default-lock">No accounts assigned = no account access</div></div><section class="user-panel"><div class="user-list-header"><div><h3>Your team <span class="count-label">${accessUsers.length}</span></h3><p>New users start with no channel or ad-account access.</p></div><input id="user-search" aria-label="Search users" placeholder="Search name or login…" value="${safe(userFilter)}"></div><div id="user-list"></div></section>`;document.querySelector('#new-user').onclick=()=>editUser();document.querySelector('#user-search').oninput=e=>{userFilter=e.target.value;userRows()};userRows()}

function editUser(id){const existing=accessUsers.find(u=>u.id===id);const u=existing||{name:'',email:'',functions:[],channels:[],adAccounts:[],status:'Not invited'};modal(`<form id="user-access-form"><div class="modal-head"><div><div class="eyebrow">USER MANAGEMENT</div><h2>${existing?'Manage user':'Add user'}</h2></div><button type="button" data-close aria-label="Close user form">×</button></div><section class="access-section"><div class="section-heading"><span class="step-number">1</span><div><h3>Basic details</h3><p>The email address is their login.</p></div></div><div class="basic-fields"><div class="field"><label for="access-name">Full name</label><input id="access-name" required maxlength="100" value="${safe(u.name)}" placeholder="Alex Taylor" autocomplete="off"></div><div class="field"><label for="access-email">Login email</label><input id="access-email" type="email" required value="${safe(u.email)}" placeholder="alex@harbourview.example" autocomplete="off"></div></div><div class="invite-status"><span>Invitation: <strong>${safe(u.status)}</strong></span><small>Demo only · no email will be sent</small></div></section><section class="access-section"><div class="section-heading"><span class="step-number">2</span><div><h3>Function access</h3><p>Choose the actions this person can perform.</p></div></div><div class="function-options">${functionList.map(f=>`<label class="function-option"><input type="checkbox" name="functions" value="${f[0]}" ${u.functions.includes(f[0])?'checked':''}><span><strong>${f[1]}</strong><small>${f[2]}</small></span></label>`).join('')}</div><div class="permission-hint">Enabling a function does not give access to any account. Adding an ad account never grants access to it automatically.</div></section><section class="access-section"><div class="section-heading"><span class="step-number">3</span><div><h3>Account assignments</h3><p>Function permissions apply only to the accounts selected below.</p></div></div><div class="assignment-summary" id="assignment-summary"></div><details ${u.channels.length?'open':''}><summary>Social channels <span>${socialResources.length} available</span></summary><div class="resource-list">${resourceList(socialResources,u.channels,'channels')}</div></details><details ${u.adAccounts.length?'open':''}><summary>Ad accounts <span>${adResources.length} available</span></summary><div class="resource-list">${resourceList(adResources,u.adAccounts,'adAccounts')}</div></details><div class="permission-hint">No access to unassigned channels or ad accounts. Advertising spend always needs separate authorization.</div></section><p id="user-form-error" role="alert"></p><div class="user-form-footer"><button type="button" class="btn" data-close>Cancel</button><div class="actions"><button class="btn" type="submit" name="intent" value="save">Save user</button><button class="btn primary" type="submit" name="intent" value="invite">${existing&&u.status==='Invited (demo)'?'Resend demo invitation':'Save & invite (demo)'}</button></div></div></form>`);const box=document.querySelector('.modal-box');box.classList.add('user-access-dialog');box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label',existing?'Manage user':'Add user');document.querySelector('#access-name').focus();const summary=()=>{const channelCount=document.querySelectorAll('[name="channels"]:checked').length,adCount=document.querySelectorAll('[name="adAccounts"]:checked').length;document.querySelector('#assignment-summary').textContent=channelCount||adCount?`${channelCount} channels and ${adCount} ad accounts selected. All other accounts remain inaccessible.`:'No accounts assigned. This user cannot access any channel or ad account.'};summary();document.querySelectorAll('[name="channels"],[name="adAccounts"]').forEach(c=>c.onchange=summary);document.querySelector('#user-access-form').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#access-name').value.trim(),email=document.querySelector('#access-email').value.trim().toLowerCase();if(!name){document.querySelector('#user-form-error').textContent='Enter a full name.';return}if(accessUsers.some(x=>x.id!==id&&x.email.toLowerCase()===email)){document.querySelector('#user-form-error').textContent='This login email already belongs to a user.';return}const get=n=>[...document.querySelectorAll(`[name="${n}"]:checked`)].map(c=>c.value);const invite=e.submitter?.value==='invite';const saved={...u,id:id||crypto.randomUUID(),name,email,functions:get('functions'),channels:get('channels'),adAccounts:get('adAccounts'),status:invite?'Invited (demo)':u.status};if(existing)accessUsers[accessUsers.indexOf(existing)]=saved;else accessUsers.push(saved);saveAccessUsers();close();showUsers();toast(invite?'Demo invitation recorded. No email sent.':'User and account permissions saved.')}}
// A function grant and a matching explicit account assignment are both required.
function hasAccountFunction(user,functionId,resourceType,resourceId){return Boolean(user&&user.functions.includes(functionId)&&['channels','adAccounts'].includes(resourceType)&&user[resourceType].includes(resourceId))}
const accessExample={functions:['content.create','ads.create'],channels:['assigned-channel'],adAccounts:[]};

function profileArt(index){const colors=['#c5dc94','#8db8ca','#d6b789','#a5c5b5','#baa6ce','#c2cba5'];const bg=colors[index%6];const patterns=[`<path d="M0 60 25 32 44 48 65 20 90 48 100 40V100H0Z" fill="#334c38"/><path d="M0 77q25-14 50 0t50 0v23H0Z" fill="#7eaaa0"/><circle cx="28" cy="23" r="10" fill="#f6f2d9"/>`,`<path d="M10 70h80v6H10z M20 65V40h12v25m9 0V40h14v25m11 0V40h13v25M15 35 50 15 85 35Z" fill="#334539"/><path d="M10 82h80" stroke="#e9efd9" stroke-width="5"/>`,`<path d="M10 70q25-45 80 0" fill="none" stroke="#4a6554" stroke-width="8"/><path d="M0 76h100M0 88h100" stroke="#f4eddb" stroke-width="4"/><circle cx="50" cy="33" r="15" fill="#f4eddb"/>`,`<path d="M48 94V30" stroke="#4b6545" stroke-width="7"/><circle cx="50" cy="34" r="25" fill="#42684c"/><circle cx="27" cy="49" r="20" fill="#628b55"/><circle cx="72" cy="48" r="20" fill="#7da568"/>`,`<path d="M20 72V29q0-9 10-9h40q10 0 10 9v43Z" fill="#424f49"/><path d="M27 31h46v23H27z" fill="#e2ecd6"/><circle cx="33" cy="64" r="5" fill="#d8e7c6"/><circle cx="67" cy="64" r="5" fill="#d8e7c6"/><path d="M28 72v10m44-10v10" stroke="#424f49" stroke-width="7"/>`,`<path d="M0 70q50-35 100 0v30H0Z" fill="#52694c"/><path d="M50 24v45M24 46h52" stroke="#edf3dd" stroke-width="9"/><circle cx="50" cy="47" r="32" fill="none" stroke="#edf3dd" stroke-width="3"/>`];const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>${patterns[index%6]}</svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}

v class="asset-section-title"><div><h3>Social channels</h3><p>Manage the accounts that share this group’s brand and voice.</p></div><button class="btn primary" id="connect-social">＋ Add social channel</button></div><div class="channel-card-grid">${channels.map(c=>`<article class="social-card">${channelAvatar(c,'large')}<div class="social-card-text"><h4>${safe(c.name)}</h4><p>${c.network} · ${networkOptions.find(n=>n.name===c.network)?.type||'Account'}</p></div><span class="badge warn">Demo connection</span><div class="social-card-footer"><span>${c.network==='X'?'API access & commercial terms unverified':'API capabilities unverified'}</span><button class="asset-link" data-channel-details="${c.id}">Details →</button></div></article>`).join('')||'<div class="asset-empty"><h3>No channels yet</h3><p>Add your first channel to this asset group.</p></div>'}</div><div class="asset-footnote">Profile artwork and accounts are fictional. Adding a demo channel does not connect a real social account.</div>`:assetTab==='brand'?`<form id="brand-form"><div class="asset-section-title"><div><h3>Brand & direction</h3><p>A shared brief for content created for this asset group.</p></div><button class="btn primary" type="submit">Save changes</button></div><div class="field"><label for="brand-name">Brand name</label><input id="brand-name" required value="${safe(g.brand)}"></div><div class="field"><label for="brand-voice">Voice & tone</label><textarea id="brand-voice" rows="3" placeholder="How should this brand sound?">${safe(g.voice)}</textarea></div><div class="field"><label for="brand-direction">Content direction</label><textarea id="brand-direction" rows="4" placeholder="Goals, audience and what to prioritize">${safe(g.direction)}</textarea></div><p class="asset-footnote">This is saved guidance for future drafts. It does not generate or publish content automatically.</p></form>`:'<div class="asset-empty"><div class="ad-placeholder">＋</div><h3>Ad accounts will live here</h3><p>Keep paid and organic accounts under the same brand.<br>Ad-account setup is planned for a later step.</p><span class="badge">No advertising spend enabled</span></div>'}</div></section></div>`;document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{assetsData.selected=b.dataset.asset;persistAssets();showAssetGroups()});document.querySelectorAll('[data-asset-tab]').forEach(b=>b.onclick=()=>{assetTab=b.dataset.assetTab;showAssetGroups()});document.querySelector('#new-asset-group').onclick=newAssetGroup;document.querySelector('#connect-social')?.addEventListener('click',connectSocial);document.querySelector('#brand-form')?.addEventListener('submit',e=>{e.preventDefault();g.brand=document.querySelector('#brand-name').value.trim();g.voice=document.querySelector('#brand-voice').value.trim();g.direction=document.querySelector('#brand-direction').value.trim();persistAssets();toast('Brand, voice and content direction saved.')});document.querySelectorAll('[data-channel-details]').forEach(b=>b.onclick=()=>{const c=assetsData.channels.find(c=>c.id===b.dataset.channelDetails);modal(`<div class="modal-head"><h2>${safe(c.name)}</h2><button data-close aria-label="Close">×</button></div><div class="channel-detail-head">${channelAvatar(c,'large')}<div><strong>${c.network}</strong><p>Demo connection · ${safe(g.name)}</p></div></div><p class="form-description">Fictional account. Authentication, media publishing, comments, messaging, analytics, rate limits and platform approvals have not been verified. No tokens or credentials are stored.</p><p class="permission-hint">Only explicitly assigned users can access this account. Asset-group membership grants no access.</p>`)});}

ector('#channel-setup').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#social-account-name').value.trim(),assetGroup=document.querySelector('#social-asset-group').value;if(!name)return;if(assetsData.channels.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.network===network)){document.querySelector('#channel-setup-error').textContent='That demo account already exists on this network.';return}assetsData.channels.push({id:crypto.randomUUID(),name,network,assetGroup,art});assetsData.selected=assetGroup;assetTab='channels';persistAssets();close();showAssetGroups();installAccountPicker(true);toast(`${network} demo channel added. Assign user access separately.`)}}

name]').forEach(l=>l.hidden=!l.dataset.pickerName.includes(e.target.value.toLowerCase()));const count=()=>{const total=menu.querySelectorAll('.picker-accounts input:checked').length;toggle.querySelector(':scope>span:nth-child(2)').textContent=total===assetsData.channels.length?`All channels (${total})`:`${total} channels selected`;};menu.querySelectorAll('.picker-accounts input').forEach(c=>c.onchange=count);document.querySelector('#picker-all').onclick=()=>{menu.querySelectorAll('.picker-accounts input').forEach(c=>c.checked=true);count()}}

  <script data-source="operations.js">

const initialPosts=Array.from({length:42},(_,i)=>({id:'POST-'+(300+i),channel:assetsData.channels[i%assetsData.channels.length].id,title:['Fall leaf collection','Route 8 detour','Explore the waterfront','Council meeting recap','Community swim registration','Stormwater service notice'][i%6],text:['Fall leaf collection begins Monday. Place paper yard-waste bags at the curb by 7 a.m. Find your collection day on the municipal service calendar.','Route 8 is using a temporary detour. Accessible boarding is available at the temporary Alder Street stop. Check your trip before travelling.','A little fresh air, close to home. Discover accessible trails and enjoy autumn along the Harbourview waterfront.','Your council, your community. Read the highlights from this week’s meeting and learn about upcoming opportunities to participate.','Make a splash this season. Community swim registration opens Friday at 9 a.m. Accessible programs and fee assistance are available.','Crews are checking storm drains following heavy rainfall. Avoid flooded roads and report service concerns through the municipal contact centre.'][i%6],status:['Draft','In review','Scheduled','Published','Failed'][i%5],art:i%6,created:nowISO(),alt:'Fictional municipal illustration for the service update.',scheduled:'2026-11-02T10:30',history:[]}));
let ops;try{ops=JSON.parse(localStorage.getItem(OPS_KEY))||null}catch{}

let currentPage='soc',viewUser='admin',contentNetwork='All',contentStatus='All',contentSearch='',inboxSearch='',inboxSentiment='All',inboxOwner='All',inboxType='All',inboxState='Open',selectedCase=null,streamTimer=null;

function saveOps(){try{localStorage.setItem(OPS_KEY,JSON.stringify(ops));return true}catch{toast('Demo storage is full. Changes could not be saved.');return false}}
function logOps(action,detail){ops.events.unshift({id:crypto.randomUUID(),action,detail,actor:isAdmin()?'Demo administrator':currentUser()?.name,time:nowISO()});ops.events=ops.events.slice(0,100);saveOps()}
function preferenceKey(){return 'ngyn-preferences-'+(viewUser==='admin'?'administrator':viewUser)}
function getPreferences(){try{return JSON.parse(localStorage.getItem(preferenceKey()))||{theme:'dark',size:'standard',contrast:false,motion:false,focus:true}}catch{return {theme:'dark',size:'standard',contrast:false,motion:false,focus:true}}}
function applyPreferences(){const p=getPreferences();document.documentElement.dataset.theme=p.theme;document.documentElement.dataset.textSize=p.size;document.documentElement.classList.toggle('high-contrast',p.contrast);document.documentElement.classList.toggle('reduce-motion',p.motion);document.documentElement.classList.toggle('strong-focus',p.focus)}
const navSections=[['WORKSPACE',[['soc','Social Operation Center','◎',null]]],['CONTENT',[['content','All content','▦','content.create'],['assets','Asset groups','▱','content.create'],['calendar','Publishing calendar','▦','content.publish']]],['ENGAGEMENT',[['inbox','Inbox & comments','☷','inbox.respond'],['listening','Social listening','◉','reports.view']]],['INSIGHTS',[['analytics','Analytics & reports','▥','reports.view'],['ads','Advertising','◇','ads.create']]],['ADMINISTRATION',[['users','Users & access','♙','admin'],['audit','Activity log','≡','admin']]]];
function pageAllowed(page){if(page==='preferences'||page==='soc')return true;if(['users','audit'].includes(page))return isAdmin();if(page==='assets')return isAdmin();if(page==='content')return ['content.create','content.approve','content.publish','reports.view'].some(can);if(page==='calendar')return can('content.publish');if(page==='inbox')return can('inbox.respond');if(page==='ads')return can('ads.create')||can('ads.manage');return can('reports.view')}
function menuMarkup(){return navSections.map(([title,entries])=>{const available=entries.filter(e=>pageAllowed(e[0]));return available.length?`<div class="menu-section"><div class="menu-label">${title}</div>${available.map(e=>`<button data-go="${e[0]}" ${e[0]==='assets'?'id="groups-nav"':e[0]==='users'?'id="users-nav"':''} class="${currentPage===e[0]?'active':''}"><span class="menu-symbol">${e[2]}</span>${e[1]}</button>`).join('')}</div>`:''}).join('')}
function renderWorkspace(page=currentPage){if(!pageAllowed(page)){page='soc';toast('Your demo user does not have that function permission.')}currentPage=page;applyPreferences();document.querySelector('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div><h1>NGYN</h1><small>Harbourview · fictional demo</small></div></div><nav class="nav">${menuMarkup()}</nav><div class="sidebar-preferences"><button class="btn" data-go="preferences">⚙ My preferences</button><small>Simulated APIs · browser demo store</small></div></aside><section class="content"><header class="topbar"><button class="btn mobile-menu" data-cmd="menu" aria-label="Toggle menu">☰</button><div class="crumb"><small>Municipality of Harbourview · Fictional</small><strong>${({soc:'Social Operation Center',content:'All content',assets:'Asset groups',inbox:'Resident inbox & comments',preferences:'My preferences',users:'Users & access',audit:'Activity log'})[page]||page}</strong></div><label class="view-as">View as user<select id="preview-user" aria-label="View as user"><option value="admin">Demo administrator</option>${accessUsers.map(u=>`<option value="${u.id}" ${viewUser===u.id?'selected':''}>${safe(u.name)}</option>`).join('')}</select></label><button class="btn" data-go="preferences" aria-label="My preferences">⚙</button></header><main id="main" class="main"></main></section></div><div id="modal"></div>`;if(page==='assets'){showAssetGroups();decorateBrand()}else if(page==='users'){showUsers()}else if(page==='soc')renderSOC();else if(page==='content'||page==='calendar')renderContent(page==='calendar');else if(page==='inbox')renderInbox();else if(page==='preferences')renderPreferences();else if(page==='audit')renderAudit();else renderSupporting(page);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>renderWorkspace(b.dataset.go));document.querySelector('#preview-user').onchange=e=>{viewUser=e.target.value;selectedCase=null;renderWorkspace('soc')};document.querySelector('[data-cmd="menu"]')?.addEventListener('click',()=>document.querySelector('.sidebar').classList.toggle('open'));bindOpsCommands()}
function heading(title,description,buttons=''){return `<div class="page-head groups-heading"><div><div class="eyebrow">HARBOURVIEW / DEMO WORKSPACE</div><h2>${title}</h2><p>${description}</p></div><div class="actions">${buttons}</div></div>`}
function emptyAccess(){return '<div class="ops-empty"><h3>No channel access</h3><p>An administrator must assign a channel before you can view its content or resident conversations.</p></div>'}
function renderSOC(){const cases=visibleCases(),open=cases.filter(c=>c.status!=='Resolved'),critical=open.filter(c=>c.urgency==='Critical'),scheduled=visiblePosts().filter(p=>p.status==='Scheduled');document.querySelector('#main').innerHTML=heading('Social Operation Center','What needs action, who owns it, and what changes next.',`<span class="sample-label">SIMULATED UPDATES</span><button class="btn" data-cmd="stream">${streamTimer?'Ⅱ Pause stream':'▶ Play demo stream'}</button><button class="btn primary" data-cmd="next-update">Next update →</button>`)+`<div class="ops-emergency ${critical.length||ops.paused?'critical':''}"><div><span class="eyebrow">${critical.length?'PRIORITY INCIDENT':'PUBLISHING CONTROL'}</span><h3>${critical.length?`${critical.length} critical resident report${critical.length>1?'s':''} need verification`:ops.paused?'Publishing is paused':'No critical resident reports'}</h3><p>${critical.length?'Reported flooding at Alder Street underpass. Verify with municipal operations; sentiment is not evidence of an emergency.':'Monitor incoming reports and assigned cases.'}</p><strong>${ops.paused?`${scheduled.length} scheduled posts blocked by the demo pause`:'Scheduled posts are eligible for manual demo processing'}</strong></div><div class="actions">${can('inbox.respond')?'<button class="btn" data-cmd="critical-case">Open priority case</button>':''}${isAdmin()?`<button class="btn ${ops.paused?'primary':'danger'}" data-cmd="pause-publishing">${ops.paused?'Authorize resume':'Pause publishing'}</button>`:''}</div></div><div class="grid metrics">${[['Open cases',open.length],['Unassigned',open.filter(c=>!c.owner).length],['High priority',open.filter(c=>c.urgency==='High').length],['Scheduled / blocked',scheduled.length]].map(([l,v])=>`<div class="metric"><span class="label">${l}</span><b>${v}</b><span class="delta">Derived from current demo records</span></div>`).join('')}</div>${!isAdmin()&&!assetsData.channels.some(c=>accountAllowed(c.id))?emptyAccess():`<div class="ops-columns"><section class="card"><h3>Response priorities</h3>${open.slice().sort((a,b)=>({Critical:0,High:1,Normal:2}[a.urgency]-{Critical:0,High:1,Normal:2}[b.urgency])).slice(0,5).map(c=>`<button class="ops-list-button" data-case-open="${c.id}"><span><strong>${safe(c.text.slice(0,70))}</strong><small>${c.id} · ${safe(accessUsers.find(u=>u.id===c.owner)?.name||'Unassigned')} · ${c.urgency==='Critical'?'Verify immediately':c.urgency==='High'?'Review within 15 min':'2h demo target'}</small></span><span class="badge ${c.urgency==='Critical'?'fail':'warn'}">${c.urgency}</span></button>`).join('')||'<p>No open cases.</p>'}</section><section class="card"><h3>Publishing queue</h3><p class="ops-muted">${ops.paused?'Pause gate active. Jobs cannot be processed.':'Manual demo processing only. Nothing is transmitted.'}</p>${scheduled.slice(0,4).map(p=>`<div class="row"><div class="grow"><strong>${safe(p.title)}</strong><small>${safe(channelById(p.channel)?.network||'Channel')}</small></div><span class="badge ${ops.paused?'fail':'warn'}">${ops.paused?'Blocked':'Scheduled'}</span></div>`).join('')}${can('content.publish')?'<button class="btn" data-cmd="process-queue">Process next demo job</button>':''}<h3 style="margin-top:25px">Integration signals</h3><p class="ops-muted">Bluesky · sample sync delayed 4 minutes. Other networks: demo snapshots only.</p></section></div>`}<section class="card" style="margin-top:20px"><h3>Live simulation feed</h3><p class="ops-muted">Play advances one fictional event every 12 seconds. Pause anytime. The feed never calls a social API.</p>${(isAdmin()?ops.events:[]).slice(0,6).map(e=>`<div class="row"><span class="badge">Demo</span><div class="grow"><strong>${safe(e.action)}</strong><small>${safe(e.detail)} · ${timeLabel(e.time)}</small></div></div>`).join('')||'<p class="ops-muted">Choose Next update to bring in the first event.</p>'}</section>`;bindCaseLinks()}
function nextDemoUpdate(){const n=ops.updateIndex++;const channel=assetsData.channels[n%assetsData.channels.length];if(n%4===0){ops.cases.unshift({id:'CASE-LIVE-'+Date.now(),channel:channel.id,type:'Comment',text:'Sample incoming report: standing water near Alder Street. Can municipal crews confirm the situation?',author:'Fictional resident',sentiment:'Concerned',urgency:'Critical',owner:'',status:'Open',notes:[],draft:'',created:nowISO()});logOps('New critical report · simulated','A fictional comment was added to the inbox. Requires staff verification.')}else if(n%4===1){const c=ops.cases.find(c=>c.status==='Open');if(c){c.urgency='High';logOps('Response target approaching · simulated',c.id+' now has high priority.')}}else if(n%4===2){logOps('Provider sync warning · simulated','Bluesky sample sync is delayed. No real platform was queried.')}else{ops.cases.unshift({id:'CASE-LIVE-'+Date.now(),channel:channel.id,type:'Comment',text:'Thank you for the accessible route information. It made planning our trip easier.',author:'Fictional resident',sentiment:'Positive',urgency:'Normal',owner:'',status:'Open',notes:[],draft:'',created:nowISO()});logOps('New positive comment · simulated','A fictional resident response was added to the inbox.')}saveOps();if(currentPage==='soc')renderWorkspace('soc');else if(currentPage==='inbox')renderWorkspace('inbox')}
function pauseDialog(){if(!isAdmin())return;modal(`<form id="pause-form"><div class="modal-head"><h2>${ops.paused?'Authorize publishing resume':'Pause all scheduled publishing'}</h2><button type="button" data-close aria-label="Close">×</button></div><p class="form-description">${ops.paused?'This releases the demo queue only. External transmission remains disabled.':'Every pending scheduled demo job will be blocked until an administrator resumes.'}</p><div class="field"><label for="pause-reason">Reason (required)</label><textarea id="pause-reason" required rows="3"></textarea></div><button class="btn danger" type="submit">${ops.paused?'Confirm resume':'Confirm pause'}</button></form>`);document.querySelector('#pause-form').onsubmit=e=>{e.preventDefault();const reason=document.querySelector('#pause-reason').value.trim();if(!reason)return;ops.paused=!ops.paused;logOps(ops.paused?'Emergency pause activated':'Publishing resumed',reason);close();renderWorkspace('soc')}}

function postMarkup(p){const c=channelById(p.channel);if(!c)return '';const net=c.network;return `<article class="native-post net-${net.toLowerCase()}"><header><div class="post-identity">${channelAvatar(c)}<div><strong>${safe(c.name)}</strong><small>${net==='X'||net==='Bluesky'?'@harbourview.demo':net==='LinkedIn'?'Municipal services · Fictional account':'Fictional account · Sample post'} · ${net}</small></div></div><span>•••</span></header>${net==='YouTube'?`<img class="post-media wide" src="${profileArt(p.art)}" alt="${safe(p.alt)}"><div class="post-caption"><strong>${safe(p.title)}</strong><p>${safe(p.text)}</p></div>`:net==='Instagram'?`<img class="post-media portrait" src="${profileArt(p.art)}" alt="${safe(p.alt)}"><div class="post-reactions">♡　♧　➤ <span>▢</span></div><div class="post-caption"><strong>${safe(c.name)}</strong> ${safe(p.text)}</div>`:`<div class="post-caption">${net==='LinkedIn'?'<strong>'+safe(p.title)+'</strong><br>':''}${safe(p.text)}</div><img class="post-media ${net==='X'||net==='Bluesky'?'wide':'square'}" src="${profileArt(p.art)}" alt="${safe(p.alt)}">`}<div class="post-reactions">${net==='YouTube'?'♡ Like　　Share　　Save':net==='LinkedIn'?'Like　　Comment　　Repost　　Send':net==='X'||net==='Bluesky'?'♧ Reply　　⇄ Repost　　♡ Like':'♡ Like　　♧ Comment　　➤ Share'}</div><div class="native-disclaimer">Approximate ${net} layout · fictional media · no fabricated metrics</div></article>`}

p.alt)}"><img src="${samplePhoto(i,220)}" alt="${safe(p.alt)}" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div><div class="field" style="margin-top:20px"><label for="single-media-file">Upload photo · PNG, JPEG or WebP, max 600 KB</label><input id="single-media-file" type="file" accept="image/png,image/jpeg,image/webp"><small>Stored locally. Video uploading is not implemented in this demo.</small></div><div class="field"><label for="single-alt">ALT text</label><input id="single-alt" value="${safe(singleDraft.alt)}" required></div></div><div class="card"><h3>Brand context</h3><div class="field"><label for="single-brand-group">Asset group</label><select id="single-brand-group"><option value="">No brand context selected</option>${assetsData.groups.filter(g=>isAdmin()||assetsData.channels.some(c=>c.assetGroup===g.id&&accountAllowed(c.id))).map(g=>`<option value="${g.id}" ${g.id===singleDraft.assetGroup?'selected':''}>${safe(g.name)}</option>`).join('')}</select></div><div class="field"><label for="single-guideline">Guideline set · guide + visuals</label><select id="single-guideline"><option value="">Choose a guideline</option>${(board?.sets||[]).map(s=>`<option value="${s.id}" ${s.id===singleDraft.guideline?'selected':''}>${safe(s.name)}${s.reviewed?'':' · needs review'}</option>`).join('')}</select></div><p class="ops-muted">Master rules and selected guidance inform mock drafts. Human editorial review is still required. Selecting a brand never grants channel access.</p></div></section><aside class="composer-preview-panel"><div class="preview-heading"><h3>Post preview</h3><span class="badge">Approximate layouts</span></div><div class="composer-preview-tabs"><button data-preview-net="All" class="${previewNetwork==='All'?'active':''}">All</button>${networks.map(n=>`<button data-preview-net="${n}" class="${previewNetwork===n?'active':''}">${n}</button>`).join('')}</div><div id="single-post-previews"></div></aside></div><div class="single-composer-foot function showMediaStorage(){document.querySelector('.crumb strong').textContent='Media storage';const folderName=mediaFolder==='All'?'All files':mediaFolder==='Trash'?'Trash':mediaData.folders.find(f=>f.id===mediaFolder)?.name||'All files';document.querySelector('#main').innerHTML=heading('Media storage','Your team’s reusable photos, videos and documents.',`<button class="btn" id="media-mock-integrations">Mock integrations</button><span class="badge">${mediaStorageSummary()}</span>${can('media.manage')?'<button class="btn" id="media-new-folder">＋ Folder</button><button class="btn primary" id="media-upload">↑ Upload</button>':''}`)+`<div class="ops-filters"><label>Library<select id="media-library"><option value="All" ${mediaFolder==='All'?'selected':''}>My media</option><option value="Trash" ${mediaFolder==='Trash'?'selected':''}>Trash</option>${mediaData.folders.map(f=>`<option value="${f.id}" ${mediaFolder===f.id?'selected':''}>${safe(f.name)}</option>`).join('')}</select></label><label class="grow">Search<input id="media-search" value="${safe(mediaQuery)}" placeholder="Search name, ALT text or tags…"></label><label>Sort<select id="media-sort">${['Newest','Oldest','Name'].map(s=>`<option ${s===mediaSort?'selected':''}>${s}</option>`)}</select></label><label>Type<select id="media-type">${['All','Images','Videos','Documents'].map(s=>`<option ${s===mediaType?'selected':''}>${s}</option>`)}</select></label><div class="switch media-layout-switch"><button id="media-grid" class="${mediaLayout==='grid'?'active':''}" aria-label="Grid view" aria-pressed="${mediaLayout==='grid'}">${menuIcon('content')}</button><button id="media-list" class="${mediaLayout==='list'?'active':''}" aria-label="List view" aria-pressed="${mediaLayout==='list'}">${menuIcon('audit')}</button></div></div><section class="media-folder-section"><h3>Folders</h3><div class="media-folders">${mediaData.folders.map(f=>`<div class="media-folder"><button data-open-media-folder="${f.id}">${menuIcon('assets')}<span>${safe(f.name)}</span><small>${mediaData.assets.filter(a=>mayBrowseMedia(a)&&!a.trashed&&a.folder===f.id).length}</small></button>${can('media.manage')&&(isAdmin()||f.owner===viewUser)?`<button class="media-folder-more" data-edit-media-folder="${f.id}" aria-label="Manage ${safe(f.name)} folder">•••</button>`:''}</div>`).join('')}</div></section><div class="media-files-heading"><div><h3>${safe(folderName)}</h3><span class="ops-muted" id="media-file-count"></span></div><div id="media-bulk-actions"></div></div><section id="media-files"></section><input id="media-upload-input" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,application/pdf" class="hidden"><p class="ops-muted">Browser-local demo storage (IndexedDB). Remote samples show credits; file sizes are shown only when known. Trash is recoverable. No real Canva or Drive connection.</p>`;document.querySelector('#media-library').onchange=e=>{mediaFolder=e.target.value;mediaSelected.clear();showMediaStorage()};document.querySelector('#media-search').oninput=e=>{mediaQuery=e.target.value;renderMediaFiles()};document.querySelector('#media-sort').onchange=e=>{mediaSort=e.target.value;renderMediaFiles()};document.querySelector('#media-type').onchange=e=>{mediaType=e.target.value;renderMediaFiles()};document.querySelector('#media-grid').onclick=()=>{mediaLayout='grid';showMediaStorage()};document.querySelector('#media-list').onclick=()=>{mediaLayout='list';showMediaStorage()};document.querySelector('#media-upload')?.addEventListener('click',()=>document.querySelector('#media-upload-input').click());document.querySelector('#media-upload-input').onchange=e=>uploadMediaFiles([...e.target.files]);document.querySelector('#media-new-folder')?.addEventListener('click',()=>editMediaFolder());document.querySelectorAll('[data-open-media-folder]').forEach(b=>b.onclick=()=>{mediaFolder=b.dataset.openMediaFolder;mediaSelected.clear();showMediaStorage()});document.querySelectorAll('[data-edit-media-folder]').forEach(b=>b.onclick=()=>editMediaFolder(b.dataset.editMediaFolder));document.querySelector('#media-mock-integrations').onclick=()=>assetModal('Media integrations · mocked',`<p class="form-description">Canva editing and Drive storage are planned integration points. These controls do not authenticate or contact another service.</p><div class="actions"><button class="btn" id="media-canva-demo">Mock Connect Canva</button><button class="btn" id="media-drive-demo">Mock Connect Drive</button></div><p id="media-mock-result" class="ops-muted">No connection configured.</p>`);document.addEventListener('click',mediaIntegrationClick,{once:true});renderMediaFiles()}
function mediaIntegrationClick(e){if(e.target.id==='media-canva-demo'||e.target.id==='media-drive-demo')document.querySelector('#media-mock-result').textContent='Simulated connection request only. No account was connected.';else if(document.querySelector('#media-mock-result'))document.addEventListener('click',mediaIntegrationClick,{once:true})}
function renderMediaFiles(){const records=visibleMediaAssets();document.querySelector('#media-file-count').textContent=records.length+' files';const bulk=document.querySelector('#media-bulk-actions');bulk.innerHTML=mediaSelected.size?`<span class="badge">${mediaSelected.size} selected</span> ${can('media.manage')?'<button class="btn" id="media-bulk-move">Move to folder</button>':''} ${can('media.delete')?`<button class="btn" id="media-bulk-trash">${mediaFolder==='Trash'?'Restore':'Move to trash'}</button>`:''}`:'';document.querySelector('#media-files').innerHTML=!records.length?'<div class="ops-empty"><h3>No files found</h3><p>Try another folder or search, or upload media you can access.</p></div>':mediaLayout==='grid'?`<div class="media-storage-grid">${records.map(a=>`<article class="media-storage-card"><button class="media-thumbnail" data-open-media="${a.id}">${mediaPreview(a)}<span class="media-thumbnail-caption">${safe(a.name)}</span></button><label class="media-select"><input type="checkbox" data-select-media="${a.id}" ${mediaSelected.has(a.id)?'checked':''} aria-label="Select ${safe(a.name)}"></label><button class="media-card-menu" data-menu-media="${a.id}" aria-label="Actions for ${safe(a.name)}">•••</button><div class="media-card-info"><span>${sizeText(a)} · ${a.width&&a.height?a.width+' × '+a.height:'Dimensions unavailable'}</span><span class="badge ${a.status==='Approved'?'ok':'warn'}">${a.status}</span></div></article>`).join('')}</div>`:`<div class="user-panel table-wrap"><table class="table user-table"><thead><tr><th>Select</th><th>Media</th><th>Name</th><th>Updated</th><th>File size</th><th>Dimensions</th><th>Actions</th></tr></thead><tbody>${records.map(a=>`<tr><td><input type="checkbox" data-select-media="${a.id}" ${mediaSelected.has(a.id)?'checked':''} aria-label="Select ${safe(a.name)}"></td><td><button class="media-list-thumb" data-open-media="${a.id}" aria-label="Open ${safe(a.name)}">${mediaPreview(a)}</button></td><td><button class="asset-link" data-open-media="${a.id}">${safe(a.name)}</button><br><small>${a.status}</small></td><td>${timeLabel(a.updated)}</td><td>${sizeText(a)}</td><td>${a.width&&a.height?a.width+' × '+a.height+' px':'Unavailable'}</td><td><button class="btn" data-menu-media="${a.id}" aria-label="Actions for ${safe(a.name)}">•••</button></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('[data-select-media]').forEach(c=>c.onchange=()=>{c.checked?mediaSelected.add(c.dataset.selectMedia):mediaSelected.delete(c.dataset.selectMedia);renderMediaFiles()});document.querySelectorAll('[data-open-media]').forEach(b=>b.onclick=()=>openMediaDetails(b.dataset.openMedia));document.querySelectorAll('[data-menu-media]').forEach(b=>b.onclick=()=>mediaActions(b.dataset.menuMedia));document.querySelector('#media-bulk-move')?.addEventListener('click',()=>moveMedia([...mediaSelected]));document.querySelector('#media-bulk-trash')?.addEventListener('click',()=>trashMedia([...mediaSelected],mediaFolder!=='Trash'));hydrateMediaPreviews()}
async function hydrateMediaPreviews(){for(const image of document.querySelectorAll('img[data-media-preview]')){const a=mediaData.assets.find(a=>a.id===image.dataset.mediaPreview);if(a?.blobId){try{image.src=await mediaURL(a)}catch{image.alt='Local file unavailable in this browser'}}}}
function editMediaFolder(id){const f=mediaData.folders.find(f=>f.id===id);if(!can('media.manage')||f&&!(isAdmin()||f.owner===viewUser))return;assetModal(f?'Manage folder':'Create folder',`<form id="media-folder-form"><div class="field"><label for="media-folder-name">Folder name</label><input id="media-folder-name" required maxlength="100" value="${safe(f?.name||'')}"></div><div class="actions"><button class="btn primary" type="submit">${f?'Save name':'Create folder'}</button>${f?'<button class="btn" id="remove-media-folder" type="button">Remove folder only</button>':''}</div><p class="ops-muted">Removing a folder returns its files to My Media. Files are not deleted.</p></form>`);document.querySelector('#media-folder-form').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#media-folder-name').value.trim();if(!name)return;if(mediaData.folders.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){toast('That folder name already exists.');return}f?f.name=name:mediaData.folders.push({id:crypto.randomUUID(),name,owner:viewUser});saveMedia();close();showMediaStorage()};document.querySelector('#remove-media-folder')?.addEventListener('click',()=>{mediaData.assets.forEach(a=>{if(a.folder===id)a.folder=null});mediaData.folders=mediaData.folders.filter(x=>x.id!==id);if(mediaFolder===id)mediaFolder='All';saveMedia();close();showMediaStorage();toast('Folder removed; files kept in My Media.')})}
async function inspectMediaFile(file){const blobURL=URL.createObjectURL(file);try{if(file.type.startsWith('image/'))return await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve({width:image.naturalWidth,height:image.naturalHeight});image.onerror=()=>reject(new Error('Invalid image'));image.src=blobURL});return {width:null,height:null}}finally{URL.revokeObjectURL(blobURL)}}
async function uploadMediaFiles(files,replaceId){if(!can('media.manage'))return;const allowed=['image/png','image/jpeg','image/webp','image/gif','video/mp4','video/webm','application/pdf'];let count=0;for(const file of files){if(!allowed.includes(file.type)||file.size>20*1024*1024){toast('Skipped '+file.name+': supported files up to 20 MB.');continue}try{const dimensions=await inspectMediaFile(file),blobId=crypto.randomUUID();await putMediaBlob(blobId,file);const a=replaceId?mediaData.assets.find(a=>a.id===replaceId):null;if(a&&!mayManageMedia(a))return;if(a){a.versions.push({blobId:a.blobId||null,url:a.url||null,updated:a.updated,bytes:a.bytes});Object.assign(a,{blobId,url:null,type:file.type,bytes:file.size,...dimensions,status:'Needs review',updated:nowISO()})}else mediaData.assets.unshift({id:crypto.randomUUID(),name:file.name,type:file.type,folder:['All','Trash'].includes(mediaFolder)?null:mediaFolder,blobId,bytes:file.size,...dimensions,alt:'',tags:[],status:'Needs review',channelIds:[],owner:viewUser,updated:nowISO(),versions:[],trashed:false});count++}catch(error){toast('Could not store '+file.name+'. Check browser storage availability.')}}if(count){saveMedia();logOps(replaceId?'Media replaced':'Media uploaded',count+' browser-local file(s); review required.');close();showMediaStorage();toast(count+' file(s) stored in this browser.')}}
function mediaActions(id){const a=mediaData.assets.find(a=>a.id===id);if(!a||!mayBrowseMedia(a))return;assetModal('File actions',`<h3>${safe(a.name)}</h3><div class="media-action-list"><button class="btn" data-file-action="details">Preview / edit details</button><button class="btn" data-file-action="link">Get local demo link</button>${mayManageMedia(a)?'<button class="btn" data-file-action="replace">Replace file</button><button class="btn" data-file-action="move">Move to folder</button><button class="btn" data-file-action="rename">Rename</button>':''}<button class="btn" data-file-action="download">${a.blobId?'Download stored file':'Open original photo source'}</button>${mayManageMedia(a,'media.delete')?`<button class="btn" data-file-action="trash">${a.trashed?'Restore from trash':'Move to trash'}</button>`:''}</div><p id="media-link-output" class="ops-muted"></p><input id="media-replace-file" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,application/pdf">`);document.querySelectorAll('[data-file-action]').forEach(b=>b.onclick=async()=>{const cmd=b.dataset.fileAction;if(cmd==='details')openMediaDetails(id);if(cmd==='link'){const link=location.origin+location.pathname+'#media='+encodeURIComponent(id);document.querySelector('#media-link-output').textContent=link+' — local demo link, not a public file URL.';try{await navigator.clipboard.writeText(link);toast('Local demo link copied.')}catch{toast('Select and copy the displayed link.')}}if(cmd==='move')moveMedia([id]);if(cmd==='rename')renameMedia(id);if(cmd==='replace'){document.querySelector('#media-replace-file').onchange=e=>uploadMediaFiles([...e.target.files],id);document.querySelector('#media-replace-file').click()}if(cmd==='download'){if(a.blobId){const url=await mediaURL(a),link=document.createElement('a');link.href=url;link.download=a.name;link.click()}else{const link=document.createElement('a');link.href=a.source;link.target='_blank';link.rel='noopener noreferrer';link.click()}}if(cmd==='trash')trashMedia([id],!a.trashed)})}
function renameMedia(id){const a=mediaData.assets.find(a=>a.id===id);if(!a||!mayManageMedia(a))return;assetModal('Rename file',`<form id="media-rename-form"><div class="field"><label for="media-rename-name">File name</label><input id="media-rename-name" required maxlength="180" value="${safe(a.name)}"></div><button class="btn primary" type="submit">Save name</button></form>`);document.querySelector('#media-rename-form').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#media-rename-name').value.trim();if(!name)return;a.name=name;a.updated=nowISO();saveMedia();close();showMediaStorage()}}
function moveMedia(ids){const assets=mediaData.assets.filter(a=>ids.includes(a.id)&&mayManageMedia(a));if(!assets.length)return;assetModal('Move files to folder',`<form id="media-move-form"><p class="form-description">${assets.length} selected file(s)</p><div class="field"><label for="media-target-folder">Destination folder</label><select id="media-target-folder"><option value="">My media (no folder)</option>${mediaData.folders.map(f=>`<option value="${f.id}">${safe(f.name)}</option>`).join('')}</select></div><button class="btn primary" type="submit">Move files</button></form>`);document.querySelector('#media-move-form').onsubmit=e=>{e.preventDefault();assets.forEach(a=>{a.folder=document.querySelector('#media-target-folder').value||null;a.updated=nowISO()});saveMedia();mediaSelected.clear();close();showMediaStorage()}}
function trashMedia(ids,trashed){const assets=mediaData.assets.filter(a=>ids.includes(a.id)&&mayManageMedia(a,'media.delete'));if(!assets.length)return;assets.forEach(a=>{a.trashed=trashed;a.updated=nowISO()});saveMedia();logOps(trashed?'Media moved to recoverable trash':'Media restored',assets.length+' file(s).');mediaSelected.clear();close();showMediaStorage();toast(trashed?'Files moved to trash. Restore them anytime.':'Files restored.')}
async function openMediaDetails(id){const a=mediaData.assets.find(a=>a.id===id);if(!a||!mayBrowseMedia(a))return;const url=await mediaURL(a);assetModal('Media details',`<div class="media-details-layout"><div>${a.type.startsWith('image/')?`<img class="media-detail-image" src="${url}" alt="${safe(a.alt||a.name)}" referrerpolicy="no-referrer">`:a.type.startsWith('video/')?`<video class="media-detail-image" controls src="${url}"></video>`:'<div class="media-file-placeholder">PDF document</div>'}${a.source?`<p class="ops-muted"><a href="${a.source}" target="_blank" rel="noopener noreferrer">${safe(a.credit)} · source</a></p>`:''}<p class="ops-muted">${sizeText(a)} · ${a.width&&a.height?a.width+' × '+a.height:'Dimensions unavailable'}<br>${a.versions.length+1} version(s)</p></div><form id="media-details-form"><h3>${safe(a.name)}</h3><span class="badge ${a.status==='Approved'?'ok':'warn'}">${a.status}</span><div class="field"><label for="media-detail-alt">ALT text / accessible description</label><textarea id="media-detail-alt" rows="4" ${mayManageMedia(a)?'':'disabled'}>${safe(a.alt)}</textarea></div><div class="field"><label for="media-detail-tags">Tags · comma-separated</label><input id="media-detail-tags" value="${safe(a.tags.join(', '))}" ${mayManageMedia(a)?'':'disabled'}></div><div class="actions">${mayManageMedia(a)?'<button type="submit" class="btn primary">Save details</button>':''}${can('media.approve')?'<button type="button" class="btn" id="approve-media">Approve</button><button type="button" class="btn" id="reject-media">Reject</button>':''}${can('content.create')&&a.type.startsWith('image/')&&a.status==='Approved'&&!a.trashed?'<button type="button" class="btn" id="use-media-post">Use in post</button>':''}</div><p class="ops-muted">Changes to accessibility details return the asset to review. Image approval requires ALT text. Video caption workflows are not implemented.</p></form></div>`);document.querySelector('.modal-box').classList.add('wide-dialog');document.querySelector('#media-details-form').onsubmit=e=>{e.preventDefault();if(!mayManageMedia(a))return;a.alt=document.querySelector('#media-detail-alt').value.trim();a.tags=document.querySelector('#media-detail-tags').value.split(',').map(t=>t.trim()).filter(Boolean);a.status='Needs review';a.updated=nowISO();saveMedia();close();showMediaStorage();toast('Details saved; approval required.')};document.querySelector('#approve-media')?.addEventListener('click',()=>{if(!can('media.approve'))return;if(a.type.startsWith('image/')&&!a.alt.trim()){toast('Save an ALT description before approving this image.');return}a.status='Approved';a.updated=nowISO();saveMedia();close();showMediaStorage()});document.querySelector('#reject-media')?.addEventListener('click',()=>{if(!can('media.approve'))return;a.status='Rejected';a.updated=nowISO();saveMedia();close();showMediaStorage()});document.querySelector('#use-media-post')?.addEventListener('click',()=>selectMediaForComposer(a))}
async function selectMediaForComposer(a){if(!can('content.create')||!mayBrowseMedia(a)||a.trashed||a.status!=='Approved'||!a.type.startsWith('image/')){toast('Choose an approved accessible image.');return}const url=await mediaURL(a);if(!singleDraft)initializeSingleDraft();if(a.blobId){const blob=await getMediaBlob(a.blobId);if(blob.size>600*1024){toast('Composer demo accepts local images up to 600 KB. Use a smaller version.');return}singleDraft.mediaUrl=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(blob)})}else{singleDraft.mediaUrl=url;singleDraft.photo=a.photoIndex||0}singleDraft.alt=a.alt;singleDraft.mediaAssetId=a.id;singleDraft.mediaCredit=a.credit||'Local demo image';saveSingleDraft();close();renderWorkspace('composer');toast('Media selected for the post. Nothing published.')}
const renderBeforeMedia=renderWorkspace;renderWorkspace=function(page=currentPage){renderBeforeMedia(page);if(page==='media'&&pageAllowed('media'))showMediaStorage()};

  <script data-source="soc-dashboard.js">
const socUI={network:'All',view:'All',keyword:'',metric:'impressions'};
const socHash=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,17);
function ensureSocialDemoData(){ops.socialStats=ops.socialStats||{};ops.posts.forEach((p,i)=>{if(!ops.socialStats[p.id]){const h=socHash(p.id);ops.socialStats[p.id]={impressions:1800+h%19000,engagements:60+h%950,sentiment:25+h%62,trend:8+h%140,observedAt:new Date(Date.now()-i*35*60000).toISOString()}}});ops.cases.forEach(c=>{if(!c.aiSentiment)c.aiSentiment={score:({Negative:-82,Concerned:-58,Neutral:4,Positive:78})[c.sentiment]??0,confidence:0.72+(socHash(c.id)%19)/100,source:'Simulated AI classifier; not a live model'}})}
function socScopedPosts(){return visiblePosts().filter(p=>socUI.network==='All'||channelById(p.channel)?.network===socUI.network)}
function socScopedMessages(){return visibleCases().filter(c=>socUI.network==='All'||channelById(c.channel)?.network===socUI.network)}
function socRecentPosts(posts){return posts.filter(p=>['Published','Failed'].includes(p.status)).sort((a,b)=>String(b.history?.at(-1)?.time||ops.socialStats[b.id]?.observedAt||b.created).localeCompare(String(a.history?.at(-1)?.time||ops.socialStats[a.id]?.observedAt||a.created))).slice(0,5)}
function socNextPosts(posts){return posts.filter(p=>p.status==='Scheduled').sort((a,b)=>(a.scheduled||'9999').localeCompare(b.scheduled||'9999')).slice(0,5)}
function socSentimentMean(values){return values.length?Math.round(values.reduce((sum,value)=>sum+value,0)/values.length):null}
function socSevenDays(posts,messages){const eligible=posts.filter(p=>p.status==='Published');return Array.from({length:7},(_,day)=>{let impressions=0,engagements=0;eligible.forEach(p=>{const stat=ops.socialStats[p.id];const weight=[9,11,12,14,15,18,21][day];impressions+=Math.round(stat.impressions*weight/100);engagements+=Math.round(stat.engagements*weight/100)});const sentimentValues=messages.filter((_,i)=>i%7===day).map(c=>c.aiSentiment.score);const date=new Date();date.setDate(date.getDate()-(6-day));return {day:date.toLocaleDateString('en-CA',{timeZone:'America/New_York',weekday:'short'}),date:date.toLocaleDateString('en-CA',{timeZone:'America/New_York'}),impressions,engagements,sentiment:socSentimentMean(sentimentValues)}})}
function socKeywords(messages,posts){const stop=new Set(['the','and','for','this','that','with','from','have','your','our','are','can','you','was','how','what','when','will','does','new','again','thank','thanks','here','there','about','sample','fictional','post','demo','during','through','along','their','them','they','has','been','its','were','not','which']);const counts={};[...messages.map(m=>m.text),...posts.map(p=>p.text)].forEach(text=>{const words=new Set((text.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!stop.has(w)));words.forEach(w=>counts[w]=(counts[w]||0)+1)});return Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,22)}
const shortNumber=n=>n===null?'—':Math.abs(n)>=1000?(n/1000).toFixed(1)+'K':String(n);
function socChart(days,metric){const values=days.map(d=>d[metric]??0),max=metric==='sentiment'?100:Math.max(...values,1),min=metric==='sentiment'?-100:0;const points=values.map((v,i)=>[45+i*82,160-(v-min)/(max-min)*120]);const labels={impressions:'Impressions',engagements:'Engagements',sentiment:'Average sentiment'};return `<div class="soc-chart" role="img" aria-label="${labels[metric]} across the last seven days; simulated values. See the data table below."><svg viewBox="0 0 590 205" aria-hidden="true"><path d="M45 40H550 M45 100H550 M45 160H550" stroke="currentColor" stroke-opacity=".13" fill="none"/>${metric==='sentiment'?'<path d="M45 100H550" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="4 4"/>':''}<path d="${points.map(([x,y],i)=>(i?'L':'M')+x+' '+y).join(' ')}" fill="none" stroke="var(--soc-line)" stroke-width="3" stroke-linejoin="round"/>${points.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--soc-line)"><title>${days[i].day}: ${days[i][metric]===null?'No samples':days[i][metric]}</title></circle><text x="${x}" y="190" text-anchor="middle" fill="currentColor" font-size="11">${days[i].day}</text>`).join('')}<text x="5" y="44" fill="currentColor" font-size="10">${shortNumber(max)}</text><text x="5" y="164" fill="currentColor" font-size="10">${min}</text></svg></div>`}
function socPostRow(p,upcoming=false){const c=channelById(p.channel),stat=ops.socialStats[p.id],status=upcoming?(ops.paused?'Paused':connectionState(c)==='Expired'?'Token expired':'Scheduled'):p.status==='Failed'?'Failed':'Healthy';return `<button class="soc-post-row" data-soc-post="${p.id}">${channelAvatar(c)}<span class="soc-post-copy"><strong>${safe(p.title)}</strong><small>${safe(c.name)} · ${c.network}</small><small>${upcoming?(p.scheduled?p.scheduled.replace('T',' · ')+' America/Halifax':'Time not set'):'Last sample check '+timeLabel(stat.observedAt)}</small></span><span class="badge ${status==='Failed'||status==='Token expired'?'fail':status==='Healthy'?'ok':'warn'}">${status}</span></button>`}
renderSOC=function(){ensureSocialDemoData();const posts=socScopedPosts(),messages=socScopedMessages(),days=socSevenDays(posts,messages);const recent=socRecentPosts(posts),next=socNextPosts(posts),negative=messages.filter(m=>m.aiSentiment.score<=-50&&(socUI.view==='All'||m.type===socUI.view)).sort((a,b)=>a.aiSentiment.score-b.aiSentiment.score);const trending=posts.filter(p=>p.status==='Published').sort((a,b)=>ops.socialStats[b.id].engagements-ops.socialStats[a.id].engagements).slice(0,5);const keywords=socKeywords(messages,posts);const impressions=days.reduce((sum,d)=>sum+d.impressions,0),engagements=days.reduce((sum,d)=>sum+d.engagements,0),average=socSentimentMean(messages.map(m=>m.aiSentiment.score));document.querySelector('#main').innerHTML=heading('Social Operation Center','Publishing health, audience conversations and channel performance.',`<span class="sample-label">SIMULATED SOCIAL DATA</span>${isAdmin()?`<button class="btn" data-cmd="stream">${streamTimer?'Ⅱ Pause stream':'▶ Play demo updates'}</button><button class="btn primary" data-cmd="next-update">Next update →</button>`:''}`)+`<div class="soc-control-bar"><label>Network<select id="soc-network">${['All',...networkOptions.map(n=>n.name)].map(n=>`<option ${n===socUI.network?'selected':''}>${n}</option>`)}</select></label><p>Last 7 days · sample snapshots · sentiment −100 (negative) to +100 (positive)</p><span class="badge ${ops.paused?'fail':'ok'}">${ops.paused?'Publishing paused':'Publishing available'}</span>${isAdmin()?`<button class="btn ${ops.paused?'primary':'danger'}" data-cmd="pause-publishing">${ops.paused?'Authorize resume':'Emergency pause'}</button>`:''}</div><div class="soc-source-note">All metrics, delivery checks and AI sentiment scores here are mocked. Counts use your accessible demo records. No platform analytics or live model is connected.</div><div class="grid metrics">${[['Total impressions',shortNumber(impressions),'7-day sample total'],['Total engagement',shortNumber(engagements),'Reactions, comments & shares · sample'],['Average sentiment',average===null?'—':(average>0?'+':'')+average,messages.length+' scored sample conversations'],['Publishing health',recent.filter(p=>p.status==='Published').length+'/'+recent.length,'Healthy among last '+recent.length+' aired attempts']].map(([label,value,caption])=>`<div class="metric"><span class="label">${label}</span><b>${value}</b><span class="delta">${caption}</span></div>`).join('')}</div><div class="soc-two-column"><section class="card"><div class="soc-section-head"><div><h3>Last 5 posts · air status</h3><p>Published and failed delivery attempts</p></div><button class="asset-link" data-soc-content="All">All content →</button></div>${recent.map(p=>socPostRow(p)).join('')||'<p class="ops-muted">No accessible published or failed posts yet.</p>'}</section><section class="card"><div class="soc-section-head"><div><h3>Next 5 posts</h3><p>Ordered by requested publish time</p></div><button class="asset-link" data-soc-content="Scheduled">Schedule →</button></div>${next.map(p=>socPostRow(p,true)).join('')||'<p class="ops-muted">No scheduled posts within your account scope.</p>'}${ops.paused?'<p class="soc-pause-note">Emergency pause blocks every pending demo publication.</p>':''}${can('content.publish')?'<button class="btn" data-cmd="process-queue">Process next demo publication</button>':''}</section></div><section class="card soc-performance"><div class="soc-section-head"><div><h3>Last 7 days · performance</h3><p>Simulated daily distribution, not production analytics</p></div><div class="soc-metric-tabs">${[['impressions','Impressions'],['engagements','Engagement'],['sentiment','Sentiment']].map(([key,label])=>`<button class="${socUI.metric===key?'active':''}" data-soc-metric="${key}">${label}</button>`).join('')}</div></div>${socChart(days,socUI.metric)}<details><summary>View daily values and source</summary><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Impressions</th><th>Engagements</th><th>Average sentiment</th><th>Source</th></tr></thead><tbody>${days.map(d=>`<tr><td>${d.date}</td><td>${d.impressions}</td><td>${d.engagements}</td><td>${d.sentiment===null?'No samples':d.sentiment}</td><td>Simulated snapshot</td></tr>`).join('')}</tbody></table></div></details></section><div class="soc-two-column"><section class="card"><div class="soc-section-head"><div><h3>Angry / negative audience conversations</h3><p>AI-style score ≤ −50 · uncertain, staff review required</p></div><label>Type<select id="soc-message-type">${['All','Comment','Message'].map(t=>`<option ${t===socUI.view?'selected':''}>${t}</option>`)}</select></label></div>${negative.slice(0,5).map(c=>`<button class="soc-message-row" data-soc-message="${c.id}"><span class="soc-sentiment-score">${c.aiSentiment.score}<small>${Math.round(c.aiSentiment.confidence*100)}% demo confidence</small></span><span class="soc-message-copy"><strong>${safe(c.text)}</strong><small>${channelById(c.channel)?.network} · ${c.type==='Message'?'Direct message':'Comment'} · ${safe(c.author)}</small><small>Responding: ${safe(accessUsers.find(u=>u.id===c.owner)?.name||'Not assigned')} · ${c.status==='Resolved'?'Reviewed':'Awaiting response'}</small></span></button>`).join('')||'<p class="ops-muted">No accessible conversations match this sentiment filter. Inbox permission and channel access are required to view message text.</p>'}<div class="soc-section-footer"><span>${negative.length} matching sample conversations</span>${can('inbox.respond')?'<button class="asset-link" id="soc-open-inbox">Open Inbox & Comments →</button>':''}</div></section><section class="card"><div class="soc-section-head"><div><h3>Highlight keywords</h3><p>Most frequent terms in accessible posts and conversations</p></div></div><div class="soc-keyword-cloud">${keywords.map(([word,count],i)=>`<button data-soc-keyword="${word}" style="font-size:${Math.max(14,29-i*.65)}px" title="${count} sample records">${word}<small>${count}</small></button>`).join('')||'<p class="ops-muted">No keywords available for your account scope.</p>'}</div><p class="ops-muted">Choose a word to inspect matching social content. Frequency is derived from demo text, not a listening provider.</p></section></div><section class="card soc-trending"><div class="soc-section-head"><div><h3>Trending posts</h3><p>Accessible published posts ranked by simulated engagement</p></div><span class="badge">Sample ranking</span></div><div class="soc-trending-grid">${trending.map((p,i)=>`<button class="soc-trend-card" data-soc-post="${p.id}"><div class="soc-trend-image"><img src="${p.mediaUrl||samplePhoto(p.art,500)}" alt="${safe(p.alt)}" loading="lazy" referrerpolicy="no-referrer"><span>#${i+1}</span></div><h4>${safe(p.title)}</h4><p>${channelById(p.channel)?.network} · ${shortNumber(ops.socialStats[p.id].engagements)} engagement</p><strong>↑ ${ops.socialStats[p.id].trend}% sample growth</strong></button>`).join('')||'<p class="ops-muted">Publish a demo post to populate this view.</p>'}</div></section><section class="card" style="margin-top:22px"><div class="soc-section-head"><div><h3>Social update feed</h3><p>Mock audience activity, delivery status and engagement changes</p></div><span class="badge">${streamTimer?'Playing · every 12 seconds':'Paused · advance manually'}</span></div>${(isAdmin()?ops.events.filter(e=>e.action.startsWith('SOC')||e.action.includes('publishing')||e.action.includes('publication')).slice(0,5):[]).map(e=>`<div class="row"><span class="badge">Demo</span><div class="grow"><strong>${safe(e.action)}</strong><small>${safe(e.detail)} · ${timeLabel(e.time)}</small></div></div>`).join('')||'<p class="ops-muted">Select Next update to simulate a social-channel event.</p>'}</section>`;document.querySelector('#soc-network').onchange=e=>{socUI.network=e.target.value;renderWorkspace('soc')};document.querySelector('#soc-message-type').onchange=e=>{socUI.view=e.target.value;renderWorkspace('soc')};document.querySelectorAll('[data-soc-metric]').forEach(b=>b.onclick=()=>{socUI.metric=b.dataset.socMetric;renderWorkspace('soc')});document.querySelectorAll('[data-soc-post]').forEach(b=>b.onclick=()=>openPost(b.dataset.socPost));document.querySelectorAll('[data-soc-content]').forEach(b=>b.onclick=()=>{contentStatus=b.dataset.socContent;contentNetwork=socUI.network;contentSearch='';renderWorkspace('content')});document.querySelectorAll('[data-soc-message]').forEach(b=>b.onclick=()=>{selectedCase=b.dataset.socMessage;inboxState='All';inboxType='All';inboxSentiment='All';inboxOwner='All';inboxSearch='';renderWorkspace('inbox')});document.querySelectorAll('[data-soc-keyword]').forEach(b=>b.onclick=()=>{contentSearch=b.dataset.socKeyword;contentStatus='All';contentNetwork=socUI.network;renderWorkspace('content')});document.querySelector('#soc-open-inbox')?.addEventListener('click',()=>{inboxState='All';inboxSentiment='Negative';inboxType='All';inboxSearch='';renderWorkspace('inbox')});};
nextDemoUpdate=function(){if(!isAdmin())return;ensureSocialDemoData();const index=ops.updateIndex++,channel=assetsData.channels[index%assetsData.channels.length];if(!channel){toast('Add a social channel first.');return}switch(index%4){case 0:ops.cases.unshift({id:'SOC-MESSAGE-'+Date.now(),channel:channel.id,type:index%8===0?'Comment':'Message',text:'I am frustrated that the Route 8 service update was unclear. Where is the accessible boarding stop?',author:'Fictional social follower',sentiment:'Negative',aiSentiment:{score:-88,confidence:.86,source:'Simulated AI classifier'},urgency:'Normal',owner:'',status:'Open',notes:[],draft:'',created:nowISO()});logOps('SOC · new angry audience conversation',channel.network+'; sentiment −88, simulated AI score.');break;case 1:{const post=ops.posts.find(p=>p.status==='Published');if(post){ops.socialStats[post.id].engagements+=120;ops.socialStats[post.id].impressions+=1850;ops.socialStats[post.id].trend+=12;ops.socialStats[post.id].observedAt=nowISO();logOps('SOC · post engagement rising',post.title+'; sample engagement +120, impressions +1,850.')}break}case 2:{const post=ops.posts.find(p=>p.status==='Scheduled');if(post){if(ops.paused){logOps('SOC · scheduled publication blocked','Emergency pause gate retained; '+post.title+' remains scheduled.')}else{post.status='Failed';post.history.push({action:'Mock provider delivery failure',time:nowISO()});ops.socialStats[post.id].observedAt=nowISO();logOps('SOC · mock publication failed',post.title+'; no platform called.')}}break}case 3:{const post=ops.posts.find(p=>p.status==='Published');if(post){ops.socialStats[post.id].observedAt=nowISO();logOps('SOC · published post healthy',post.title+'; simulated delivery check completed.')}break}}saveOps();if(currentPage==='soc'||currentPage==='inbox')renderWorkspace(currentPage)};
renderWorkspace('soc');

</script>
